spring.application.name=folyo-api
server.port=8080
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax
# Anonim oturum (OAuth yonlendirmesi) kisa yasar; giris yapinca 30 gune cikar (PrincipalSession).
server.servlet.session.timeout=30m

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true

# Lokal gelistirmede Postgres container'i uygulama kapaninca da ayakta kalsin
spring.docker.compose.lifecycle-management=start-only

# Giris sonrasi yonlendirilecek web adresi
folyo.web-url=http://localhost:3100

# Canli kartlar
folyo.media-dir=${user.home}/.folyo/media
# Video en fazla 200 MB; fotograf/sticker siniri uç noktada daha dusuk. Buyuk dosya bellege degil diske alinir.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB
spring.servlet.multipart.file-size-threshold=1MB
spring.threads.virtual.enabled=true
# Saglayici bilgileri ortam degiskeniyle verilir (README):
# FOLYO_TOKEN_KEY, FOLYO_ADMIN_EMAILS, FOLYO_LOGIN_GOOGLE_CLIENT_ID/SECRET, FOLYO_LOGIN_GITHUB_CLIENT_ID/SECRET,
# FOLYO_GITHUB_TOKEN, FOLYO_LASTFM_API_KEY,
# FOLYO_REDDIT_CLIENT_ID/SECRET, FOLYO_SPOTIFY_CLIENT_ID/SECRET, FOLYO_STRAVA_CLIENT_ID/SECRET

# Saglik kontrolu: yalniz durum (UP/DOWN) acilir; ayrinti ve diger actuator uclari kapali.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
