# Prod: tum gizli degerler ortam degiskeniyle verilir (deploy/.env.example).
# FOLYO_WEB_URL, FOLYO_TOKEN_KEY, SPRING_DATASOURCE_*, Google/GitHub OAuth istemcileri.
spring.docker.compose.enabled=false

# Oturum cerezi yalniz HTTPS uzerinden gider ve JavaScript'ten okunamaz.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=folyo_session

# Loglar tek satir JSON (Caddy ve docker logs ile aranabilir).
logging.structured.format.console=ecs
logging.level.org.springframework.security=WARN

# Hata yanitlarinda istisna/stack bilgisi yok.
server.error.include-stacktrace=never
server.error.include-message=never

# Mobil uygulama yalniz kendi semasina donebilir.
folyo.mobile.redirect-prefixes=folyo://
