name: web

on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # PageProps/LayoutProps gibi rota tipleri Next tarafindan uretilir; tsc'den once gerekir.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          build-args: |
            API_URL=http://api:8080
            WEB_URL=${{ vars.FOLYO_WEB_URL || 'https://folyo.app' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/folyo-web:latest
            ghcr.io/${{ github.repository_owner }}/folyo-web:${{ github.sha }}
